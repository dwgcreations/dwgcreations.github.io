        <!-- Phone Protection Script -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const phoneLinks = document.querySelectorAll('.protected-phone');
                
                phoneLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        const p1 = this.getAttribute('data-p1');
                        const p2 = this.getAttribute('data-p2');
                        const p3 = this.getAttribute('data-p3');
                        
                        // Formats the number and link
                        this.href = `tel:${p1}${p2}${p3}`;
                        this.innerText = `(${p1}) ${p2}-${p3}`;
                        
                        // Removes the class so it acts like a normal link afterwards
                        this.classList.remove('protected-phone');
                    });
                });
            });
        </script>
